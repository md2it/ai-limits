name: Desktop build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, for example v0.1.0
        required: true
        type: string
      macos_notarization:
        description: macOS notarization mode (full is default for releases)
        required: true
        default: full
        type: choice
        options:
          - sign-only
          - submit-only
          - full

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release input and changelog
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from the main branch." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match vMAJOR.MINOR.PATCH, for example v0.1.0." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]

          # Installed clients compare their built-in version against the version in
          # the update manifest, which is derived from this tag. A mismatch would
          # either hide the release from the updater or offer it in a loop.
          configured = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if configured != tag.lstrip("v"):
              raise SystemExit(
                  f"Cargo.toml declares workspace version {configured}, which does not match {tag}."
              )

          text = Path("CHANGELOG.md").read_text()
          if re.search(rf"^## \[{re.escape(tag)}\]", text, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md already contains a section for {tag}.")
          matches = list(re.finditer(r"^## Unreleased\s*$", text, re.MULTILINE))
          if len(matches) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one '## Unreleased' section.")
          next_section = re.search(r"^## ", text[matches[0].end():], re.MULTILINE)
          if next_section is None:
              raise SystemExit("CHANGELOG.md must contain a version section after '## Unreleased'.")
          body = text[matches[0].end():matches[0].end() + next_section.start()].strip()
          if not body:
              raise SystemExit("The '## Unreleased' section in CHANGELOG.md is empty.")
          PY

  quality:
    name: Quality gate
    runs-on: macos-latest
    needs: validate-release-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run quality gate
        run: npm run quality

  build-macos:
    name: Build macOS signed app (${{ matrix.arch }})
    runs-on: macos-latest
    needs: quality
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            platform_key: darwin-aarch64
          - arch: intel
            target: x86_64-apple-darwin
            platform_key: darwin-x86_64
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Signs the auto-update archive. Unrelated to Apple code signing: installed
      # clients verify this signature against the public key built into the app.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Import code signing certificate
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "Missing secret: APPLE_CERTIFICATE" >&2
            exit 1
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install App Store Connect API key
        if: inputs.macos_notarization != 'sign-only'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_KEY_CONTENT:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "Missing secrets: APPLE_API_KEY_ID, APPLE_API_KEY_CONTENT, and/or APPLE_API_ISSUER" >&2
            exit 1
          fi

          mkdir -p "$HOME/.private_keys"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          {
            echo "APPLE_API_KEY_PATH=$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "APPLE_API_KEY=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
          } >> "$GITHUB_ENV"

      - name: Verify updater signing key
        run: |
          set -euo pipefail

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Missing secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS app
        run: |
          set -euo pipefail
          unset APPLE_SIGNING_IDENTITY

          BUILD_ARGS=(--bundles app --target ${{ matrix.target }})
          if [[ "${{ inputs.macos_notarization }}" == "submit-only" ]]; then
            BUILD_ARGS+=(--skip-stapling)
          fi

          npm exec tauri -- build "${BUILD_ARGS[@]}"

      - name: Verify macOS app signing and notarization
        run: |
          set -euo pipefail
          scripts/verify-macos-app.sh \
            --notarization "${{ inputs.macos_notarization }}" \
            "target/${{ matrix.target }}/release/bundle/macos/AI Limits.app"

      - name: Build macOS disk image
        run: |
          set -euo pipefail

          # Tauri's own dmg bundler styles the window via a Finder AppleScript
          # step that needs the Automation permission. GitHub Actions runners
          # do not have it, so that step fails silently and ships an
          # unstyled disk image. scripts/build-macos-dmg.sh writes the same
          # window layout directly and needs no such permission.
          dmg_path="target/${{ matrix.target }}/release/bundle/dmg/AI Limits.dmg"
          scripts/build-macos-dmg.sh \
            "target/${{ matrix.target }}/release/bundle/macos/AI Limits.app" \
            "$dmg_path"

          identity="$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -n1 | sed -E 's/.*"(.+)"/\1/')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in the keychain." >&2
            exit 1
          fi
          codesign --sign "$identity" --timestamp "$dmg_path"

          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Notarize and staple macOS disk image
        if: inputs.macos_notarization != 'sign-only'
        run: |
          set -euo pipefail

          # The bundler signs the disk image but notarizes only the app inside it.
          # A downloaded disk image is assessed by Gatekeeper on its own, so it
          # needs its own notarization ticket.
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            ${{ inputs.macos_notarization == 'full' && '--wait' || '' }}

          if [[ "${{ inputs.macos_notarization }}" == "full" ]]; then
            xcrun stapler staple "$DMG_PATH"
          fi

      - name: Verify macOS disk image
        run: |
          set -euo pipefail
          scripts/verify-macos-app.sh \
            --notarization "${{ inputs.macos_notarization }}" \
            "$DMG_PATH"

      - name: Upload macOS disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-limits-macos-dmg-${{ matrix.arch }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Archive macOS app bundle
        run: |
          set -euo pipefail

          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/AI Limits.app"
          ZIP_PATH="target/release/bundle/macos/AI Limits.app.zip"

          mkdir -p "$(dirname "$ZIP_PATH")"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Verify macOS release artifact round-trip
        run: |
          set -euo pipefail
          scripts/verify-macos-app.sh \
            --notarization "${{ inputs.macos_notarization }}" \
            "target/release/bundle/macos/AI Limits.app.zip"

      - name: Collect macOS updater artifacts
        run: |
          set -euo pipefail

          bundle_dir="target/${{ matrix.target }}/release/bundle/macos"
          archive="$(find "$bundle_dir" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          signature="$(find "$bundle_dir" -maxdepth 1 -name '*.app.tar.gz.sig' -print -quit)"

          if [[ -z "$archive" || -z "$signature" ]]; then
            echo "The bundler produced no updater artifacts. Check createUpdaterArtifacts in tauri.conf.json." >&2
            exit 1
          fi

          mkdir -p updater-artifacts
          cp "$archive" "updater-artifacts/AI-Limits-macos.app.tar.gz"
          cp "$signature" "updater-artifacts/AI-Limits-macos.app.tar.gz.sig"

      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-limits-macos-updater-${{ matrix.arch }}
          path: updater-artifacts/*
          if-no-files-found: error
          retention-days: 14

      # Kept as a build artifact for diagnostics only; the release ships the disk image.
      - name: Upload macOS app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-limits-macos-app-${{ matrix.arch }}
          path: target/release/bundle/macos/AI Limits.app.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows unsigned bundles
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      # Windows is not part of the update channel, so it produces no updater
      # artifacts and needs no updater signing key.
      - name: Build unsigned Windows bundles
        run: npm exec tauri -- build --bundles nsis,msi --config src-tauri/updater-disabled.conf.json

      - name: Upload Windows unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-limits-windows-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux unsigned bundles
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      # Linux is not part of the update channel, so it produces no updater
      # artifacts and needs no updater signing key.
      - name: Build unsigned Linux bundles
        run: npm exec tauri -- build --bundles deb,appimage --config src-tauri/updater-disabled.conf.json

      - name: Upload Linux unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-limits-linux-unsigned
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-unstable-release:
    name: Publish unstable desktop pre-release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/raw

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.version }}"
          mkdir -p release-assets/upload

          # macOS ships as two single-architecture builds instead of one
          # universal binary, so each download is roughly half the size.
          for arch in arm64 intel; do
            macos_dmg="$(find "release-assets/raw/ai-limits-macos-dmg-${arch}" -type f -name '*.dmg' | head -n 1)"
            cp "$macos_dmg" "release-assets/upload/AI-Limits-${tag}-macos-${arch}.dmg"

            # The auto-updater downloads this archive, not the disk image.
            updater_archive="release-assets/raw/ai-limits-macos-updater-${arch}/AI-Limits-macos.app.tar.gz"
            cp "$updater_archive" "release-assets/upload/AI-Limits-${tag}-macos-${arch}.app.tar.gz"
          done

          windows_exe="$(find release-assets/raw/ai-limits-windows-unsigned -type f -name '*.exe' | head -n 1)"
          windows_msi="$(find release-assets/raw/ai-limits-windows-unsigned -type f -name '*.msi' | head -n 1)"
          linux_deb="$(find release-assets/raw/ai-limits-linux-unsigned -type f -name '*.deb' | head -n 1)"
          linux_appimage="$(find release-assets/raw/ai-limits-linux-unsigned -type f -name '*.AppImage' | head -n 1)"

          cp "$windows_exe" "release-assets/upload/AI-Limits-${tag}-windows-setup.exe"
          cp "$windows_msi" "release-assets/upload/AI-Limits-${tag}-windows.msi"
          cp "$linux_deb" "release-assets/upload/AI-Limits-${tag}-linux.deb"
          cp "$linux_appimage" "release-assets/upload/AI-Limits-${tag}-linux.AppImage"

          {
            echo "tag=${tag}"
            echo "title=AI Limits ${tag}"
            echo "macos_notarization=${{ inputs.macos_notarization }}"
          } >> "$GITHUB_ENV"

      - name: Finalize changelog and create tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main --tags
          remote_main="$(git rev-parse origin/main)"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "The main branch changed after this workflow started. Start a new release workflow from the current main branch." >&2
            exit 1
          fi

          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          import os
          import re

          path = Path("CHANGELOG.md")
          text = path.read_text()
          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          if re.search(rf"^## \[{re.escape(tag)}\]", text, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md already contains a section for {tag}.")
          matches = list(re.finditer(r"^## Unreleased\s*$", text, re.MULTILINE))
          if len(matches) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one '## Unreleased' section.")
          unreleased = matches[0]
          next_section = re.search(r"^## ", text[unreleased.end():], re.MULTILINE)
          if next_section is None:
              raise SystemExit("CHANGELOG.md must contain a version section after '## Unreleased'.")
          next_start = unreleased.end() + next_section.start()
          changes = text[unreleased.end():next_start].strip()
          if not changes:
              raise SystemExit("The '## Unreleased' section in CHANGELOG.md is empty.")
          release_heading = f"## [{tag}](https://github.com/{repository}/releases/tag/{tag}) — {date.today().isoformat()}"
          updated = text[:unreleased.start()] + "## Unreleased\n\n" + release_heading + "\n\n" + changes + "\n\n" + text[next_start:]
          path.write_text(updated)
          Path("release-changes.md").write_text(changes + "\n")
          Path("tag-notes.md").write_text(f"AI Limits {tag}\n\n{changes}\n")
          PY

          case "$macos_notarization" in
            full)
              macos_note="macOS (Apple Silicon and Intel builds): signed, notarized, and stapled."
              ;;
            submit-only)
              macos_note="macOS (Apple Silicon and Intel builds): signed; notarization submitted without waiting (may still be In Progress at Apple)."
              ;;
            *)
              macos_note="macOS (Apple Silicon and Intel builds): signed only (not notarized)."
              ;;
          esac

          {
            cat release-changes.md
            echo
            echo "## Build"
            echo
            echo "Unstable desktop build. ${macos_note} Windows and Linux are unsigned."
          } > release-notes.md

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          notes = Path("release-changes.md").read_text().strip()

          # macOS ships as two single-architecture builds now, each with its own
          # signature and archive. Installed universal-build clients built before
          # this change have no matching key here and simply stop being offered
          # updates; they are few enough, and auto-update recent enough, that a
          # one-time manual reinstall for them is an acceptable tradeoff for
          # roughly half the download size on both current platforms. Windows and
          # Linux ship unsigned and are absent here, which makes their clients
          # report no available update.
          platforms = {}
          for arch, platform_key in (("arm64", "darwin-aarch64"), ("intel", "darwin-x86_64")):
              signature = Path(
                  f"release-assets/raw/ai-limits-macos-updater-{arch}/AI-Limits-macos.app.tar.gz.sig"
              ).read_text().strip()
              if not signature:
                  raise SystemExit(f"The macOS {arch} updater signature is empty.")
              url = (
                  f"https://github.com/{repository}/releases/download/{tag}"
                  f"/AI-Limits-{tag}-macos-{arch}.app.tar.gz"
              )
              platforms[platform_key] = {"signature": signature, "url": url}

          manifest = {
              "version": tag.lstrip("v"),
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }

          path = Path("updater/latest.json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md updater/latest.json
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -F tag-notes.md
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$tag" release-assets/upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$title" \
            --notes-file release-notes.md \
            --prerelease
