[package]
name = "ai-limits"
version.workspace = true
edition = "2021"

[workspace]
members = [".", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[[bin]]
name = "ai-limits"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
